name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # cross-platform lock/build (P7/RC2)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: rclone-aliyunenterprise/go.mod
          cache-dependency-path: rclone-aliyunenterprise/go.sum

      - name: gofmt check
        if: runner.os != 'Windows'
        working-directory: rclone-aliyunenterprise
        run: |
          unformatted=$(gofmt -l backend cmd)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: rclone-aliyunenterprise
        run: go vet ./...

      - name: build binary (all platforms)
        working-directory: rclone-aliyunenterprise
        run: go build -o rclone-aliyunenterprise${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/rclone-aliyunenterprise

      - name: unit tests (+ race, non-Windows)
        if: runner.os != 'Windows'
        working-directory: rclone-aliyunenterprise
        run: go test -race -timeout 10m ./...

      - name: unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: rclone-aliyunenterprise
        run: go test -timeout 10m ./...
